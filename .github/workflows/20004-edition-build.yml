name: Build 20004 Edition (Windows x64)

on:
  push:
    branches: [20004-edition]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Test 20004 companion tools
        shell: pwsh
        run: py -3 -m unittest discover -s tools/20004-edition -p 'test_*.py' -v
      - name: Build native Notepad++ x64
        shell: pwsh
        run: msbuild PowerEditor/visual.net/notepadPlus.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Stage built files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path PowerEditor -Filter Notepad++.exe -File -Recurse | Where-Object { $_.FullName -match 'bin|Release' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Native executable not found after successful MSBuild' }
          New-Item -ItemType Directory -Force dist/NotepadPP-20004-Edition | Out-Null
          Copy-Item $exe.FullName dist/NotepadPP-20004-Edition/Notepad++.exe
          Copy-Item tools/20004-edition/npp20004.py dist/NotepadPP-20004-Edition/
          Copy-Item tools/20004-edition/ai_desktop.py dist/NotepadPP-20004-Edition/
          Copy-Item tools/20004-edition/Start-20004-AI.cmd dist/NotepadPP-20004-Edition/
          Copy-Item tools/20004-edition/README.md dist/NotepadPP-20004-Edition/20004-README.md
          Write-Host "Staged $($exe.FullName)"
      - name: Upload Windows x64 developer build
        uses: actions/upload-artifact@v4
        with:
          name: NotepadPP-20004-Edition-Windows-x64-dev
          path: dist/NotepadPP-20004-Edition/
          if-no-files-found: error
          retention-days: 14
